name: DFRoot Samsung KO

# Builds kernelsu.ko with the Samsung RKP/KDP/DEFEX patches (kernel/compat/).
# The resulting KO is what pairs with DFRoot: it is loaded by ksud late-load,
# running inside the vendor_modprobe domain that dfroot.ko opens up.

on:
  workflow_dispatch:
    inputs:
      kmi:
        description: 'Single KMI to build (empty = all)'
        required: false
        default: ''
        type: string
      package_name:
        description: 'Manager package name baked into the KO'
        required: false
        default: 'com.sukisu.ultra'
        type: string
      expected_size:
        description: 'Manager signature size (hex, e.g. 0x35c)'
        required: false
        default: '0x35c'
        type: string
      expected_hash:
        description: 'Manager signature SHA-256'
        required: false
        default: '947ae944f3de4ed4c21a7e4f7953ecf351bfa2b36239da37a34111ad29993eef'
        type: string
  push:
    branches: [main]
    paths:
      - 'kernel/**'
      - '.github/workflows/dfroot-samsung-ko.yml'

permissions:
  contents: read

jobs:
  build-ko:
    name: kernelsu.ko / ${{ matrix.kmi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260828
      options: --privileged

    # Skip when a single KMI was requested and this is not it. On push events
    # there are no inputs, so build everything.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.kmi == '' || inputs.kmi == matrix.kmi }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The ddk-min image runs as root and the checkout is owned by another uid,
      # so git refuses to read the tree without this.
      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify Samsung patches are present
        run: |
          set -e
          missing=0
          for f in jailbreak.c jailbreak.h defex.c kdp.c rkp.c; do
            if [ ! -f "kernel/compat/$f" ]; then
              echo "::error::kernel/compat/$f missing - did the port get committed?"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          # Fail loudly if the Kbuild wiring was lost, otherwise the KO would
          # build fine but silently lack every Samsung fix.
          grep -q 'compat/rkp.o' kernel/Kbuild || { echo "::error::compat not wired into kernel/Kbuild"; exit 1; }
          grep -q 'init_jailbreak' kernel/core/init.c || { echo "::error::init_jailbreak not called"; exit 1; }
          grep -q 'ksu_rkp_branch_patch' kernel/hook/arm64/patch_memory.c || { echo "::error::ksu_patch_text RKP branch missing"; exit 1; }
          grep -q 'ksu_commit_creds' kernel/policy/app_profile.c || { echo "::error::KDP cred path not used"; exit 1; }
          echo "Samsung patch set verified."

      - name: Build kernelsu.ko
        env:
          PACKAGE_NAME: ${{ inputs.package_name || 'com.sukisu.ultra' }}
          EXPECTED_SIZE: ${{ inputs.expected_size || '0x35c' }}
          EXPECTED_HASH: ${{ inputs.expected_hash || '947ae944f3de4ed4c21a7e4f7953ecf351bfa2b36239da37a34111ad29993eef' }}
        run: |
          set -euo pipefail
          cd kernel

          echo "=== Building for KMI: ${{ matrix.kmi }} ==="
          # The ddk-min image normally exports KDIR for its KMI; fall back to
          # the conventional path rather than failing the whole matrix.
          if [ -z "${KDIR:-}" ] && [ -d "/opt/ddk/kdir/${{ matrix.kmi }}" ]; then
            export KDIR="/opt/ddk/kdir/${{ matrix.kmi }}"
          fi
          echo "KDIR=${KDIR:-<unset>}"
          [ -n "${KDIR:-}" ] || { echo "::error::KDIR not provided by the ddk image"; exit 1; }

          CONFIG_KSU=m CONFIG_KPM=y CC=clang make \
            KSU_PACKAGE_NAME="$PACKAGE_NAME" \
            KSU_EXPECTED_SIZE="$EXPECTED_SIZE" \
            KSU_EXPECTED_HASH="$EXPECTED_HASH"

      - name: Package KO
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out/aarch64"
          mkdir -p "$OUT"
          NAME="${{ matrix.kmi }}_kernelsu.ko"
          cp kernel/kernelsu.ko "$OUT/$NAME"
          # Strip debug info only; .symtab must survive for the check below.
          llvm-strip -d "$OUT/$NAME"
          echo "=== $NAME ==="
          ls -la "$OUT/$NAME"

      # A KO that lost its compat objects would still load, but on a Samsung
      # device it would then fault or bootloop. Prove the patch markers exist.
      - name: Verify Samsung symbols in the built KO
        run: |
          set -euo pipefail
          NAME="out/aarch64/${{ matrix.kmi }}_kernelsu.ko"
          SYMS=$(llvm-nm "$NAME")
          fail=0
          for sym in init_jailbreak ksu_commit_creds ksu_rkp_branch_patch kdp_jb_init rkp_jb_init defex_jb_init; do
            if printf '%s\n' "$SYMS" | grep -q " $sym\$"; then
              echo "  ok       $sym"
            else
              echo "  MISSING  $sym"
              fail=1
            fi
          done
          echo "--- compat-related symbols present ---"
          printf '%s\n' "$SYMS" | grep -E 'jailbreak|rkp|kdp|defex|patch_fn_ret_zero' || true
          if [ "$fail" -ne 0 ]; then
            echo "::error::Samsung compat symbols missing from kernelsu.ko - the port did not compile in"
            exit 1
          fi
          echo "Samsung compat verified in the built module."

      - uses: actions/upload-artifact@v7
        with:
          name: dfroot-samsung-${{ matrix.kmi }}
          path: out/aarch64/${{ matrix.kmi }}_kernelsu.ko
          if-no-files-found: error

  summary:
    name: Summary
    needs: build-ko
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dfroot-samsung-*
          merge-multiple: true
          path: kos
        continue-on-error: true

      - name: List artifacts
        run: |
          echo "### Built kernel modules" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d kos ]; then
            echo "| file | size |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|" >> $GITHUB_STEP_SUMMARY
            for f in kos/*.ko; do
              [ -f "$f" ] && echo "| \`$(basename $f)\` | $(du -h "$f" | cut -f1) |" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "No artifacts produced." >> $GITHUB_STEP_SUMMARY
          fi

      - uses: actions/upload-artifact@v7
        if: hashFiles('kos/*.ko') != ''
        with:
          name: dfroot-samsung-all
          path: kos/*.ko
